name: build
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: ZIP entpacken
        run: unzip -q hand-tweaks.zip -d entpackt
      - name: Mod bauen
        working-directory: entpackt/hand-tweaks
        run: |
          chmod +x ./gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: hand-tweaks-jar
          path: entpackt/hand-tweaks/build/libs/hand-tweaks-*.jar
